# Moon workspace configuration for bigoci: the root Go library, the docs
# site, and the cli/ reference module.

projects:
  globs: []
  sources:
    root: '.'
    docs: 'docs'
    cli: 'cli'

defaultProject: 'root'

vcs:
  defaultBranch: 'master'
  provider: 'github'

pipeline:
  installDependencies: false

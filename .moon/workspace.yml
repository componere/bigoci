# Moon workspace configuration for bigoci: the root Go library and the docs
# site. The cli/ reference module arrives with its own project entry when it
# is built.

projects:
  globs: []
  sources:
    root: '.'
    docs: 'docs'

defaultProject: 'root'

vcs:
  defaultBranch: 'master'
  provider: 'github'

pipeline:
  installDependencies: false

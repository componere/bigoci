# Moon workspace configuration for bigoci: the root Go library, the docs
# site, the cli/ reference module, and the bench/ measurement harness.

projects:
  globs: []
  sources:
    root: '.'
    docs: 'docs'
    cli: 'cli'
    bench: 'bench'

defaultProject: 'root'

vcs:
  defaultBranch: 'master'
  provider: 'github'

pipeline:
  installDependencies: false

site_name: bigoci
site_description: Go library for uploading and downloading large files to and from OCI registries
site_url: https://imgoci.github.io/bigoci/
repo_name: imgoci/bigoci
repo_url: https://github.com/imgoci/bigoci
edit_uri: edit/master/docs/docs/
docs_dir: docs
site_dir: build
strict: true

theme:
  name: material
  language: en
  features:
    - content.action.edit
    - navigation.instant
    - navigation.tracking
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorial:
      - Get started: tutorial/get-started.md
  - How-to:
      - Push and pull a file: how-to/push-and-pull.md
      - Authenticate to a registry: how-to/authenticate.md
  - Explanation:
      - Design: explanation/design.md
  - Reference:
      - API: reference/api.md
      - Errors: reference/errors.md
      - Format: reference/format.md
      - Registry compatibility: reference/registry-compatibility.md
      - Benchmarks: reference/benchmarks.md

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences

extra_css:
  - stylesheets/palette.css

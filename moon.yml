language: 'go'
layer: 'library'
stack: 'backend'

project:
  title: 'bigoci'
  description: 'Go library for uploading and downloading large files to and from OCI registries.'
  owner: 'imgoci'
  maintainers:
    - 'jmgilman'

# Every task runs against `system` binaries that mise (mise.toml + mise.lock) puts
# on PATH; moon manages no language toolchain itself.
toolchains:
  default: 'system'

fileGroups:
  goSources:
    - '*.go'
    - 'internal/**/*.go'
    - 'go.mod'
    - 'go.sum'
    # Tool/version pins. Under the `system` toolchain moon does not hash the Go
    # binary's version, so the mise pins are inputs here too — bumping Go (or any
    # tool) in mise must invalidate the cacheable build task.
    - 'mise.toml'
    - 'mise.lock'
  lintConfig:
    - '.golangci.yml'
    - 'mise.toml'
    - 'mise.lock'
  releaseConfig:
    - 'release-please-config.json'
    - '.release-please-manifest.json'

workspace:
  inheritedTasks:
    include: []

tasks:
  format:
    command: 'golangci-lint fmt --config .golangci.yml --diff'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  lint:
    # --allow-parallel-runners: moon runs this and cli:lint concurrently, and
    # golangci-lint otherwise refuses to start while another instance runs.
    command: 'golangci-lint run --config .golangci.yml ./... --show-stats=false --allow-parallel-runners'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
    options:
      cache: false

  build:
    command: 'go build ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  # Cross-compile for the one non-unix platform the file adapter carries a
  # build branch for, so the branch cannot rot uncompiled: CI never runs
  # Windows, but it must at least keep building it.
  build-windows:
    command: 'go build ./...'
    env:
      GOOS: 'windows'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  test:
    # -race is load bearing: the adapters promise concurrent-safe ReadAt and
    # WriteAt over shared file handles, and only the race detector proves it.
    command: 'go test -race ./...'
    inputs:
      - '@group(goSources)'
    options:
      cache: false

  # Regenerates every mock from the ports in internal/transfer (AGENTS.md
  # T2/T3). Mocks are committed, so this is a hand-run task: it writes source
  # files, which is not something CI should do behind a contributor's back.
  mocks:
    command: 'mockery'
    inputs:
      - '.mockery.yml'
      - '@group(goSources)'
    options:
      cache: false
      runInCI: false

  check:
    deps:
      - 'root:format'
      - 'root:lint'
      - 'root:build'
      - 'root:build-windows'
      - 'root:test'
      - 'docs:build'
      - 'cli:check'
      - 'bench:check'
    inputs:
      - '@group(goSources)'
      - '@group(lintConfig)'
      - '@group(releaseConfig)'
    options:
      cache: false
      runInCI: true
